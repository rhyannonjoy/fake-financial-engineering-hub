# Site settings
title: Fake Financial Engineering Hub
description: Technical documentation for financial systems engineering at Fake Company, Inc.
url: https://rhyannonjoy.github.io
# Test locally at "http://localhost:4000/fake-financial-engineering-hub/"
# Use Terminal commands: rm -rf _site .jekyll-cache, bundle exec jekyll serve
# Alternative option: change baseurl: "" but revert before deploying
baseurl: "/fake-financial-engineering-hub"

# Theme
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

# Enable custom CSS
sass:
  sass_dir: _sass
  style: compressed

# Point to custom stylesheet (add this line)
custom_css_path: /assets/css/custom.scss

# Add custom stylesheet
custom_head: true

plugins:
  - jekyll-sass-converter

# Navigation
nav_enabled: true
nav_sort: case_insensitive
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Footer content
footer_content: "© 2026 Fake Company, Inc. | This is a portfolio project with fictionalized content."

# Aux links (top right navigation)
aux_links:
  "View on GitHub":
    - "https://github.com/rhyannonjoy/fake-financial-engineering-hub"

# Disable auto-generated navigation title link
aux_links_new_tab: true

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - README.md

# Collections (optional, for better organization)
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Defaults for front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "docs"
    values:
      layout: "default"